name: MALDI-GlycoID Automated Validation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate default N-glycan library
        run: python scripts/validate_library.py

      - name: Verify local application startup health check
        run: python scripts/run_local.py --check-only

      - name: Run full unit, scientific, parser, UI, and API test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
